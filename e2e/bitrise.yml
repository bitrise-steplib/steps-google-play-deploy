format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

workflows:
  test_compile_from_git_url:
    summary: |-
      Builds the Step from its git URL the way a customer's workflow does, on whatever stack this runs on, and
      checks that the compiled Step starts. It makes no Google Play calls: app_path points nowhere, so the Step stops
      at input validation, after it was built and started.
    steps:
    - script:
        title: Go on this stack
        inputs:
        - content: |-
            echo "stack: ${BITRISEIO_STACK_ID:-unknown}"
            go version || echo "no go on PATH"
            echo "GOTOOLCHAIN=${GOTOOLCHAIN:-<unset>} GOFLAGS=${GOFLAGS:-<unset>} GOPROXY=$(go env GOPROXY 2>/dev/null)"
            bitrise version
    - script:
        title: Build and start the Step from its git URL
        inputs:
        - content: |-
            set -eo pipefail
            cat > /tmp/compile-check.yml <<'YML'
            format_version: "11"
            workflows:
              compile:
                steps:
                - git::https://github.com/bitrise-steplib/steps-google-play-deploy.git@debug-compile-check:
                    inputs:
                    - service_account_json_key_path: /nonexistent/key.json
                    - package_name: com.example.compile.check
                    - app_path: /nonexistent/app.aab
            YML
            set +e
            bitrise run --config /tmp/compile-check.yml compile 2>&1 | tee /tmp/compile-check.log
            set -e
            echo "-----"
            grep -E "go: downloading go1|toolchain|go version|requires go" /tmp/compile-check.log || true
            if grep -q "Getting configuration" /tmp/compile-check.log; then
              echo "RESULT: the Step was built and started on ${BITRISEIO_STACK_ID:-this stack}"
            else
              echo "RESULT: the Step did not start on ${BITRISEIO_STACK_ID:-this stack}"
              exit 1
            fi
