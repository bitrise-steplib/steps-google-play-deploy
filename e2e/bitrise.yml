format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

app:
  envs:
  - SIMPLESAMPLE_ANDROID_KEYSTORE_URL: $SIMPLESAMPLE_ANDROID_KEYSTORE_URL
  - SIMPLESAMPLE_ANDROID_KEYSTORE_PASSWORD: $SIMPLESAMPLE_ANDROID_KEYSTORE_PASSWORD
  - SIMPLESAMPLE_ANDROID_KEY_ALIAS: $SIMPLESAMPLE_ANDROID_KEY_ALIAS
  - SIMPLESAMPLE_ANDROID_KEY_PASSWORD: $SIMPLESAMPLE_ANDROID_KEY_PASSWORD

  - MULTIAAB_ANDROID_KEYSTORE_URL: $MULTIAAB_ANDROID_KEYSTORE_URL
  - MULTIAAB_ANDROID_KEYSTORE_PASSWORD: $MULTIAAB_ANDROID_KEYSTORE_PASSWORD
  - MULTIAAB_ANDROID_KEY_ALIAS: $MULTIAAB_ANDROID_KEY_ALIAS
  - MULTIAAB_ANDROID_KEY_PASSWORD: $MULTIAAB_ANDROID_KEY_PASSWORD

  - GOOGLE_PLAY_SERVICE_ACCOUNT_KEY_URL: $GOOGLE_PLAY_SERVICE_ACCOUNT_KEY_URL

workflows:
  test_wearos_deploy:
    summary: Builds and deploys a main app and a wearable app as AAB
    envs:
    - TEST_APP_URL: https://github.com/bitrise-io/sample-apps-wear-os.git
    - BRANCH: master

    - BITRISEIO_ANDROID_KEYSTORE_URL: $MULTIAAB_ANDROID_KEYSTORE_URL
    - BITRISEIO_ANDROID_KEYSTORE_PASSWORD: $MULTIAAB_ANDROID_KEYSTORE_PASSWORD
    - BITRISEIO_ANDROID_KEYSTORE_ALIAS: $MULTIAAB_ANDROID_KEY_ALIAS
    - BITRISEIO_ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: $MULTIAAB_ANDROID_KEY_PASSWORD

    - PACKAGE_NAME: io.bitrise.android.sample_xyztouristattractions

    - SERVICE_ACCOUNT_KEY_URL: $GOOGLE_PLAY_SERVICE_ACCOUNT_KEY_URL
    - TRACK: wear:internal
    before_run:
    - _setup
    steps:
    - set-java-version:
        inputs:
        - set_java_version: "17"
    - script:
        title: Set $VERSION_CODE
        inputs:
        - content: |-
            set -ex

            envman add --key VERSION_CODE --value $(( $BITRISE_BUILD_NUMBER * 10 ))
    - change-android-versioncode-and-versionname:
        inputs:
        - new_version_code: $VERSION_CODE
        - version_code_offset: "1"
        - build_gradle_path: $BITRISE_SOURCE_DIR/Wearable/build.gradle
    - android-build:
        title: Build wearable app
        inputs:
        - variant: release
        - build_type: aab
        - module: Wearable
    - sign-apk:
        inputs:
        - android_app: $BITRISE_AAB_PATH
        - use_apk_signer: true
    - path::./:
        title: Execute step
        # Limit running this test to only one stack to avoid parallel testing issues
        # Running E2E tests on all stacks in parallel would cause conflicting deployments in Google Play to the same app
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
        inputs:
        - service_account_json_key_path: $SERVICE_ACCOUNT_KEY_URL
        - package_name: $PACKAGE_NAME
        - app_path: $BITRISE_DEPLOY_DIR/Wearable-release-bitrise-signed.aab
        - track: $TRACK
        - mapping_file: $BITRISE_DEPLOY_DIR/Wearable-mapping.txt
        - verbose_log: true

  test_aab_deploy:
    envs:
    - TEST_APP_URL: https://github.com/bitrise-io/sample-apps-android-sdk22.git
    - BRANCH: master

    - BITRISEIO_ANDROID_KEYSTORE_URL: $SIMPLESAMPLE_ANDROID_KEYSTORE_URL
    - BITRISEIO_ANDROID_KEYSTORE_PASSWORD: $SIMPLESAMPLE_ANDROID_KEYSTORE_PASSWORD
    - BITRISEIO_ANDROID_KEYSTORE_ALIAS: $SIMPLESAMPLE_ANDROID_KEY_ALIAS
    - BITRISEIO_ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: $SIMPLESAMPLE_ANDROID_KEY_PASSWORD

    - PACKAGE_NAME: com.bitrise_io.sample_apps_android_simple_google_play_deploy
    - SERVICE_ACCOUNT_KEY_URL: $GOOGLE_PLAY_SERVICE_ACCOUNT_KEY_URL
    - TRACK: internal
    before_run:
    - _setup
    steps:
    - set-java-version:
        inputs:
        - set_java_version: "17"
    - change-android-versioncode-and-versionname:
        inputs:
        - build_gradle_path: ./app/build.gradle
        - new_version_code: $BITRISE_BUILD_NUMBER
        - new_version_name: 0.2.4
    - gradle-runner:
        inputs:
        - gradle_task: bundleRelease
        - gradlew_path: ./gradlew
    - sign-apk:
        inputs:
        - android_app: $BITRISE_AAB_PATH
        - use_apk_signer: true
    - path::./:
        title: Execute step
        # Limit running this test to only one stack to avoid parallel testing issues.
        # All tests deploying to this package must share ONE stack (the ubuntu worker):
        # a deploy from a parallel worker commits an edit for the same package, which
        # deletes this worker's open edit mid-upload ("This Edit has been deleted").
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
        inputs:
        - service_account_json_key_path: $SERVICE_ACCOUNT_KEY_URL
        - package_name: $PACKAGE_NAME
        - app_path: $BITRISE_SIGNED_AAB_PATH
        - track: $TRACK
        - user_fraction: 0.6
        - release_name: Overwritten release name
        - verbose_log: true

  test_apk_deploy_custom_track:
    summary: Tests deploying an APK to a user-defined track
    envs:

    - TEST_APP_URL: https://github.com/bitrise-io/sample-apps-android-sdk22.git
    - BRANCH: master

    - BITRISEIO_ANDROID_KEYSTORE_URL: $SIMPLESAMPLE_ANDROID_KEYSTORE_URL
    - BITRISEIO_ANDROID_KEYSTORE_PASSWORD: $SIMPLESAMPLE_ANDROID_KEYSTORE_PASSWORD
    - BITRISEIO_ANDROID_KEYSTORE_ALIAS: $SIMPLESAMPLE_ANDROID_KEY_ALIAS
    - BITRISEIO_ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: $SIMPLESAMPLE_ANDROID_KEY_PASSWORD

    - PACKAGE_NAME: com.bitrise_io.sample_apps_android_simple_google_play_deploy
    - SERVICE_ACCOUNT_KEY_URL: $GOOGLE_PLAY_SERVICE_ACCOUNT_KEY_URL
    - TRACK: apk-testing
    before_run:
    - _setup
    steps:
    - set-java-version:
        inputs:
        - set_java_version: "17"
    - change-android-versioncode-and-versionname:
        inputs:
        - build_gradle_path: ./app/build.gradle
        - new_version_code: $BITRISE_BUILD_NUMBER
        # +1: this test shares the worker (and so the build number) with
        # test_aab_deploy; Play refuses an APK at a version code that already
        # holds a bundle (test_artifact_map_dry_run uses +2)
        - version_code_offset: "1"
        - new_version_name: 0.2.4
    - gradle-runner:
        inputs:
        - gradle_task: assembleRelease
        - gradlew_path: ./gradlew
    - sign-apk:
        inputs:
        - android_app: $BITRISE_APK_PATH_LIST
        - use_apk_signer: true
    - path::./:
        title: Execute step
        # Limit running this test to only one stack to avoid parallel testing issues
        # Running E2E tests on all stacks in parallel would cause conflicting deployments in Google Play to the same app
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
        inputs:
        - service_account_json_key_path: $SERVICE_ACCOUNT_KEY_URL
        - package_name: $PACKAGE_NAME
        - app_path: $BITRISE_SIGNED_APK_PATH
        - track: $TRACK
        - mapping_file: ""
        - user_fraction: ""
        - retry_without_sending_to_review: true
        - verbose_log: true
  test_artifact_map_dry_run:
    description: |-
      Full producer→signer→consumer chain for the variant-keyed artifact map
      (SSW-3065), against the real Google Play API in dry-run mode: the branch
      gradle-runner exports the map, the branch sign-apk renames its references to
      the signed artifact, and this step pairs the mapping from the map ALONE
      (mapping_file is deliberately empty). A pre-deploy check proves the map
      references the exact signed APK the deploy consumes, so the identity lookup
      cannot miss; pairing decision logic itself is unit-tested.
    envs:
    - TEST_APP_URL: https://github.com/bitrise-io/sample-apps-android-sdk22.git
    - BRANCH: master

    - BITRISEIO_ANDROID_KEYSTORE_URL: $SIMPLESAMPLE_ANDROID_KEYSTORE_URL
    - BITRISEIO_ANDROID_KEYSTORE_PASSWORD: $SIMPLESAMPLE_ANDROID_KEYSTORE_PASSWORD
    - BITRISEIO_ANDROID_KEYSTORE_ALIAS: $SIMPLESAMPLE_ANDROID_KEY_ALIAS
    - BITRISEIO_ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: $SIMPLESAMPLE_ANDROID_KEY_PASSWORD

    - PACKAGE_NAME: com.bitrise_io.sample_apps_android_simple_google_play_deploy
    - SERVICE_ACCOUNT_KEY_URL: $GOOGLE_PLAY_SERVICE_ACCOUNT_KEY_URL
    - TRACK: internal
    before_run:
    - _setup
    steps:
    - set-java-version:
        inputs:
        - set_java_version: "17"
    - script:
        title: Set $VERSION_CODE higher than previously submitted
        inputs:
        - content: |-
            set -ex

            envman add --key VERSION_CODE --value $(( $BITRISE_BUILD_NUMBER + 2 ))
    - change-android-versioncode-and-versionname:
        inputs:
        - build_gradle_path: ./app/build.gradle
        - new_version_code: $VERSION_CODE
        - new_version_name: 0.2.5-artifactmap
    # TODO: switch to the steplib versions once the artifact-map releases ship
    - git::https://github.com/bitrise-steplib/steps-gradle-runner.git@SSW-3065-variant-artifact-map:
        title: gradle-runner (artifact map branch)
        inputs:
        - gradle_task: assembleRelease
        - gradlew_path: ./gradlew
    - git::https://github.com/bitrise-steplib/steps-sign-apk.git@SSW-3065-update-artifact-map:
        title: sign-apk (artifact map branch)
        inputs:
        - android_app: $BITRISE_APK_PATH_LIST
        - use_apk_signer: true
    - script:
        title: Check the signed artifact map before deploying
        inputs:
        - content: |-
            #!/bin/bash
            set -e
            map="$BITRISE_ANDROID_ARTIFACT_MAP_PATH"
            echo "--- artifact map after signing ---"; cat "$map"; echo "---"
            # sign-apk must have renamed the map's APK reference to the signed name
            signed_name=$(basename "$BITRISE_SIGNED_APK_PATH")
            jq -e --arg n "$signed_name" '.modules.app.release.apk == [$n]' "$map" > /dev/null \
              || { echo "expected the map to reference the signed APK ($signed_name)"; exit 1; }
            jq -e '.modules.app.release.mapping != null and .modules.app.release.mapping != ""' "$map" > /dev/null \
              || { echo "expected a mapping paired for app/release"; exit 1; }
            echo "OK: map references the signed APK and its mapping"
    - path::./:
        title: Execute step (mapping from the artifact map ONLY)
        # Limit running this test to only one stack to avoid parallel testing issues
        # Running E2E tests on all stacks in parallel would cause conflicting deployments in Google Play to the same app
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
        inputs:
        - service_account_json_key_path: $SERVICE_ACCOUNT_KEY_URL
        - package_name: $PACKAGE_NAME
        - app_path: $BITRISE_SIGNED_APK_PATH
        - dry_run: true
        - track: $TRACK
        - mapping_file: ""
        - user_fraction: ""
        - retry_without_sending_to_review: true
        - verbose_log: true

  test_duckduckgo_deploy:
    description: |-
      Full-scale artifact-map chain on the DuckDuckGo fixture (SSW-3065), against
      the real Google Play API in dry-run mode: two minified Compose flavors
      produce the complete customer layout (outputs + intermediates + Compose
      mappings, collision renames), the play flavor's APK is signed and deployed,
      and the mapping must be selected from the MULTI-variant map alone
      (mapping_file is empty). Every step is gated to the latest Ubuntu stack —
      the build is heavy. The first run doubles as the access probe for the
      com.bitrise.ddgmobile Play app. Dry runs never commit, so the fixture's
      constant version code is never consumed.
    envs:
    - BITRISEIO_ANDROID_KEYSTORE_URL: $SIMPLESAMPLE_ANDROID_KEYSTORE_URL
    - BITRISEIO_ANDROID_KEYSTORE_PASSWORD: $SIMPLESAMPLE_ANDROID_KEYSTORE_PASSWORD
    - BITRISEIO_ANDROID_KEYSTORE_ALIAS: $SIMPLESAMPLE_ANDROID_KEY_ALIAS
    - BITRISEIO_ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: $SIMPLESAMPLE_ANDROID_KEY_PASSWORD

    - PACKAGE_NAME: com.bitrise.ddgmobile
    - SERVICE_ACCOUNT_KEY_URL: $GOOGLE_PLAY_SERVICE_ACCOUNT_KEY_URL
    - TRACK: internal
    steps:
    - set-java-version:
        # heavy real-world build: run on a single stack only
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
        inputs:
        - set_java_version: "21"
    - script:
        title: recreate _tmp directory
        # heavy real-world build: run on a single stack only
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
        inputs:
        - content: rm -rf "./_tmp" && mkdir "./_tmp"
    - change-workdir:
        title: Switch working dir to _tmp
        # heavy real-world build: run on a single stack only
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
        inputs:
        - path: ./_tmp
    # TODO: point at bitrise-io/DuckDuckGo-Android once the fixture patch
    # (R8 on release + com.bitrise.ddgmobile application id) can live there
    - git::https://github.com/bitrise-steplib/bitrise-step-simple-git-clone.git:
        # heavy real-world build: run on a single stack only
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
        inputs:
        - repository_url: https://github.com/lpusok/DuckDuckGo-Android.git
        - clone_into_dir: .
        - branch: SSW-3065-minified-fixture
    - script:
        title: Init git submodules (native bloom filter sources)
        # heavy real-world build: run on a single stack only
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
        inputs:
        - content: git submodule update --init --recursive --depth 1
    - restore-gradle-cache@2:
        # heavy real-world build: run on a single stack only
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
    - activate-build-cache-for-gradle@3:
        # remote build cache is an add-on; a build without it must still pass
        is_skippable: true
        # heavy real-world build: run on a single stack only
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
    - install-missing-android-tools@3:
        # heavy real-world build: run on a single stack only
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
        inputs:
        - gradlew_path: ./gradlew
        - ndk_version: 28.2.13676358
    - script:
        title: Size Gradle JVM heap to the machine
        # heavy real-world build: run on a single stack only
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
        inputs:
        - content: |-
            #!/bin/bash
            set -ex
            # R8 over the full app OOMs with the project's default -Xmx6g, while a
            # heap sized for a big machine OOM-kills the daemon on a small one; give
            # the daemons a share of the actual RAM so the same workflow fits medium
            # (16GB -> 8g/4g/3) and large (32GB -> 15g/7g/6) workers alike
            if [ -r /proc/meminfo ]; then
              total_gb=$(awk '/MemTotal/ {printf "%.0f", $2/1024/1024}' /proc/meminfo)
            else
              total_gb=$(($(sysctl -n hw.memsize) / 1024 / 1024 / 1024))
            fi
            envman add --key GRADLE_DAEMON_HEAP --value "$((total_gb / 2))g"
            envman add --key KOTLIN_DAEMON_HEAP --value "$((total_gb / 4))g"
            envman add --key GRADLE_MAX_WORKERS --value "$((total_gb / 5))"
    - git::https://github.com/bitrise-steplib/steps-gradle-runner.git@SSW-3065-variant-artifact-map:
        title: gradle-runner (artifact map branch, two minified flavors)
        # heavy real-world build: run on a single stack only
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
        inputs:
        - build_root_directory: .
        # bundles, not APKs: the Play app (created 2026) only accepts AABs
        - gradle_task: bundleInternalRelease bundlePlayRelease
        - gradlew_path: ./gradlew
        - gradle_options: -PuseProprietaryFont=false "-Pkotlin.daemon.jvmargs=-Xmx$KOTLIN_DAEMON_HEAP" --max-workers=$GRADLE_MAX_WORKERS "-Dorg.gradle.jvmargs=-Xmx$GRADLE_DAEMON_HEAP -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC"
        - mapping_file_include_filter: "*mapping.txt"
    - script:
        title: Pick the play flavor's AAB from the multi-variant map
        # heavy real-world build: run on a single stack only
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
        inputs:
        - content: |-
            #!/bin/bash
            set -e
            map="$BITRISE_ANDROID_ARTIFACT_MAP_PATH"
            echo "--- artifact map ---"; cat "$map"; echo "---"
            # the map must be genuinely multi-variant with distinct mappings
            internal=$(jq -r '.modules.app.internalRelease.mapping // ""' "$map")
            play=$(jq -r '.modules.app.playRelease.mapping // ""' "$map")
            [ -n "$internal" ] && [ -n "$play" ] && [ "$internal" != "$play" ] \
              || { echo "expected both flavors paired with distinct mappings"; exit 1; }
            play_aab="$(dirname "$map")/$(jq -r '.modules.app.playRelease.aab[0]' "$map")"
            [ -f "$play_aab" ] || { echo "play AAB not found: $play_aab"; exit 1; }
            envman add --key PLAY_AAB_PATH --value "$play_aab"
            echo "deploying: $play_aab"
    - git::https://github.com/bitrise-steplib/steps-sign-apk.git@SSW-3065-update-artifact-map:
        title: sign-apk (artifact map branch)
        # heavy real-world build: run on a single stack only
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
        inputs:
        - android_app: $PLAY_AAB_PATH
        - use_apk_signer: true
    - script:
        title: Check the signed artifact map before deploying
        # heavy real-world build: run on a single stack only
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
        inputs:
        - content: |-
            #!/bin/bash
            set -e
            map="$BITRISE_ANDROID_ARTIFACT_MAP_PATH"
            signed_name=$(basename "$BITRISE_SIGNED_AAB_PATH")
            jq -e --arg n "$signed_name" '.modules.app.playRelease.aab | index($n) != null' "$map" > /dev/null \
              || { echo "expected the map's play entry to reference the signed AAB ($signed_name)"; cat "$map"; exit 1; }
            echo "OK: map references the signed play AAB"
    - path::./:
        title: Execute step (multi-variant map, mapping from the map ONLY)
        # heavy real-world build: run on a single stack only
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
        inputs:
        - service_account_json_key_path: $SERVICE_ACCOUNT_KEY_URL
        - package_name: $PACKAGE_NAME
        - app_path: $BITRISE_SIGNED_AAB_PATH
        - dry_run: true
        - track: $TRACK
        - mapping_file: ""
        - user_fraction: ""
        - retry_without_sending_to_review: true
        - verbose_log: true
    - save-gradle-cache@1:
        is_always_run: true
        # heavy real-world build: run on a single stack only
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}

  test_dry_run:
    envs:
    - TEST_APP_URL: https://github.com/bitrise-io/sample-apps-android-sdk22.git
    - BRANCH: master

    - BITRISEIO_ANDROID_KEYSTORE_URL: $SIMPLESAMPLE_ANDROID_KEYSTORE_URL
    - BITRISEIO_ANDROID_KEYSTORE_PASSWORD: $SIMPLESAMPLE_ANDROID_KEYSTORE_PASSWORD
    - BITRISEIO_ANDROID_KEYSTORE_ALIAS: $SIMPLESAMPLE_ANDROID_KEY_ALIAS
    - BITRISEIO_ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: $SIMPLESAMPLE_ANDROID_KEY_PASSWORD

    - PACKAGE_NAME: com.bitrise_io.sample_apps_android_simple_google_play_deploy
    - SERVICE_ACCOUNT_KEY_URL: $GOOGLE_PLAY_SERVICE_ACCOUNT_KEY_URL
    - TRACK: internal
    before_run:
    - _setup
    steps:
    - set-java-version:
        inputs:
        - set_java_version: "17"
    - script:
        title: Set $VERSION_CODE higher than previously submitted
        inputs:
        - content: |-
            set -ex

            envman add --key VERSION_CODE --value $(( $BITRISE_BUILD_NUMBER + 1 ))
    - change-android-versioncode-and-versionname:
        inputs:
        - build_gradle_path: ./app/build.gradle
        - new_version_code: $VERSION_CODE
        - new_version_name: 0.2.5-dryrun
    - gradle-runner:
        inputs:
        - gradle_task: assembleRelease
        - gradlew_path: ./gradlew
    - sign-apk:
        inputs:
        - android_app: $BITRISE_APK_PATH_LIST
        - use_apk_signer: true
    - path::./:
        title: Execute step
        # Limit running this test to only one stack to avoid parallel testing issues
        # Running E2E tests on all stacks in parallel would cause conflicting deployments in Google Play to the same app
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
        inputs:
        - service_account_json_key_path: $SERVICE_ACCOUNT_KEY_URL
        - package_name: $PACKAGE_NAME
        - app_path: $BITRISE_SIGNED_APK_PATH
        - dry_run: true
        - track: $TRACK
        - mapping_file: ""
        - user_fraction: ""
        - retry_without_sending_to_review: true
        - verbose_log: true

  test_no_track:
    summary: Tests an experimental trackless upload (no track assigned)
    envs:
    - TEST_APP_URL: https://github.com/bitrise-io/sample-apps-android-sdk22.git
    - BRANCH: master

    - BITRISEIO_ANDROID_KEYSTORE_URL: $SIMPLESAMPLE_ANDROID_KEYSTORE_URL
    - BITRISEIO_ANDROID_KEYSTORE_PASSWORD: $SIMPLESAMPLE_ANDROID_KEYSTORE_PASSWORD
    - BITRISEIO_ANDROID_KEYSTORE_ALIAS: $SIMPLESAMPLE_ANDROID_KEY_ALIAS
    - BITRISEIO_ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: $SIMPLESAMPLE_ANDROID_KEY_PASSWORD

    - PACKAGE_NAME: com.bitrise_io.sample_apps_android_simple_google_play_deploy
    - SERVICE_ACCOUNT_KEY_URL: $GOOGLE_PLAY_SERVICE_ACCOUNT_KEY_URL
    before_run:
    - _setup
    steps:
    - set-java-version:
        inputs:
        - set_java_version: "17"
    - script:
        title: Set $VERSION_CODE higher than previously submitted
        inputs:
        - content: |-
            set -ex

            envman add --key VERSION_CODE --value $(( $BITRISE_BUILD_NUMBER + 1 ))
    - change-android-versioncode-and-versionname:
        inputs:
        - build_gradle_path: ./app/build.gradle
        - new_version_code: $VERSION_CODE
        - new_version_name: 0.2.5-notrack
    - gradle-runner:
        inputs:
        - gradle_task: assembleRelease
        - gradlew_path: ./gradlew
    - sign-apk:
        inputs:
        - android_app: $BITRISE_APK_PATH_LIST
        - use_apk_signer: true
    - path::./:
        title: Execute step
        # Limit running this test to only one stack to avoid parallel testing issues
        # Running E2E tests on all stacks in parallel would cause conflicting deployments in Google Play to the same app
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
        inputs:
        - service_account_json_key_path: $SERVICE_ACCOUNT_KEY_URL
        - package_name: $PACKAGE_NAME
        - app_path: $BITRISE_SIGNED_APK_PATH
        - track: ""
        - mapping_file: ""
        - user_fraction: ""
        - retry_without_sending_to_review: true
        - verbose_log: true

  _setup:
    steps:
    - script:
        title: Delete _tmp dir
        inputs:
        - content: rm -rf _tmp
    - change-workdir:
        title: Switch working dir to _tmp
        run_if: "true"
        inputs:
        - path: ./_tmp
        - is_create_path: true
    - git::https://github.com/bitrise-steplib/bitrise-step-simple-git-clone.git:
        inputs:
        - repository_url: $TEST_APP_URL
        - clone_into_dir: .
        - branch: $BRANCH
