format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

app:
  envs:
  - SIMPLESAMPLE_ANDROID_KEYSTORE_URL: $SIMPLESAMPLE_ANDROID_KEYSTORE_URL
  - SIMPLESAMPLE_ANDROID_KEYSTORE_PASSWORD: $SIMPLESAMPLE_ANDROID_KEYSTORE_PASSWORD
  - SIMPLESAMPLE_ANDROID_KEY_ALIAS: $SIMPLESAMPLE_ANDROID_KEY_ALIAS
  - SIMPLESAMPLE_ANDROID_KEY_PASSWORD: $SIMPLESAMPLE_ANDROID_KEY_PASSWORD

  - MULTIAAB_ANDROID_KEYSTORE_URL: $MULTIAAB_ANDROID_KEYSTORE_URL
  - MULTIAAB_ANDROID_KEYSTORE_PASSWORD: $MULTIAAB_ANDROID_KEYSTORE_PASSWORD
  - MULTIAAB_ANDROID_KEY_ALIAS: $MULTIAAB_ANDROID_KEY_ALIAS
  - MULTIAAB_ANDROID_KEY_PASSWORD: $MULTIAAB_ANDROID_KEY_PASSWORD

  - GOOGLE_PLAY_SERVICE_ACCOUNT_KEY_URL: $GOOGLE_PLAY_SERVICE_ACCOUNT_KEY_URL

workflows:
  test_wearos_deploy:
    summary: Builds and deploys a main app and a wearable app as AAB
    envs:
    - TEST_APP_URL: https://github.com/bitrise-io/sample-apps-wear-os.git
    - BRANCH: master

    - BITRISEIO_ANDROID_KEYSTORE_URL: $MULTIAAB_ANDROID_KEYSTORE_URL
    - BITRISEIO_ANDROID_KEYSTORE_PASSWORD: $MULTIAAB_ANDROID_KEYSTORE_PASSWORD
    - BITRISEIO_ANDROID_KEYSTORE_ALIAS: $MULTIAAB_ANDROID_KEY_ALIAS
    - BITRISEIO_ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: $MULTIAAB_ANDROID_KEY_PASSWORD

    - PACKAGE_NAME: io.bitrise.android.sample_xyztouristattractions

    - SERVICE_ACCOUNT_KEY_URL: $GOOGLE_PLAY_SERVICE_ACCOUNT_KEY_URL
    - TRACK: wear:internal
    before_run:
    - _setup
    steps:
    - set-java-version:
        inputs:
        - set_java_version: "17"
    - script:
        title: Set $VERSION_CODE
        inputs:
        - content: |-
            set -ex

            envman add --key VERSION_CODE --value $(( $BITRISE_BUILD_NUMBER * 10 ))
    - change-android-versioncode-and-versionname:
        inputs:
        - new_version_code: $VERSION_CODE
        - version_code_offset: "1"
        - build_gradle_path: $BITRISE_SOURCE_DIR/Wearable/build.gradle
    - android-build:
        title: Build wearable app
        inputs:
        - variant: release
        - build_type: aab
        - module: Wearable
    - sign-apk:
        inputs:
        - android_app: $BITRISE_AAB_PATH
        - use_apk_signer: true
    - path::./:
        title: Execute step
        # Limit running this test to only one stack to avoid parallel testing issues
        # Running E2E tests on all stacks in parallel would cause conflicting deployments in Google Play to the same app
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
        inputs:
        - service_account_json_key_path: $SERVICE_ACCOUNT_KEY_URL
        - package_name: $PACKAGE_NAME
        - app_path: $BITRISE_DEPLOY_DIR/Wearable-release-bitrise-signed.aab
        - track: $TRACK
        - mapping_file: $BITRISE_DEPLOY_DIR/Wearable-mapping.txt
        - verbose_log: true

  test_aab_deploy:
    envs:
    - TEST_APP_URL: https://github.com/bitrise-io/sample-apps-android-sdk22.git
    - BRANCH: master

    - BITRISEIO_ANDROID_KEYSTORE_URL: $SIMPLESAMPLE_ANDROID_KEYSTORE_URL
    - BITRISEIO_ANDROID_KEYSTORE_PASSWORD: $SIMPLESAMPLE_ANDROID_KEYSTORE_PASSWORD
    - BITRISEIO_ANDROID_KEYSTORE_ALIAS: $SIMPLESAMPLE_ANDROID_KEY_ALIAS
    - BITRISEIO_ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: $SIMPLESAMPLE_ANDROID_KEY_PASSWORD

    - PACKAGE_NAME: com.bitrise_io.sample_apps_android_simple_google_play_deploy
    - SERVICE_ACCOUNT_KEY_URL: $GOOGLE_PLAY_SERVICE_ACCOUNT_KEY_URL
    - TRACK: internal
    before_run:
    - _setup
    steps:
    - set-java-version:
        inputs:
        - set_java_version: "17"
    - script:
        title: Set $VERSION_CODE
        inputs:
        - content: |-
            set -ex

            # Every Step run of the e2e suite is on the Linux stack: Google Play keeps one open edit per service
            # account, so a deploy on another stack at the same time would discard this one's edit. The tests on
            # this stack take BITRISE_BUILD_NUMBER + 0..8 on the same app; the AAB deploy takes + 3.
            envman add --key VERSION_CODE --value $(( $BITRISE_BUILD_NUMBER + 3 ))
    - change-android-versioncode-and-versionname:
        inputs:
        - build_gradle_path: ./app/build.gradle
        - new_version_code: $VERSION_CODE
        - new_version_name: 0.2.4
    - gradle-runner:
        inputs:
        - gradle_task: bundleRelease
        - gradlew_path: ./gradlew
    - sign-apk:
        inputs:
        - android_app: $BITRISE_AAB_PATH
        - use_apk_signer: true
    - path::./:
        title: Execute step
        # Limit running this test to only one stack to avoid parallel testing issues
        # Running E2E tests on all stacks in parallel would cause conflicting deployments in Google Play to the same app
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
        inputs:
        - service_account_json_key_path: $SERVICE_ACCOUNT_KEY_URL
        - package_name: $PACKAGE_NAME
        - app_path: $BITRISE_SIGNED_AAB_PATH
        - track: $TRACK
        - user_fraction: 0.6
        - release_name: Overwritten release name
        # Proves Google Play accepts changesInReviewBehavior on a real commit. Google Play keeps this app's changes
        # "in review" for a few minutes after every commit, so `fail` would make the test depend on the timing of the
        # other tests; upload_as_draft saves a draft in that case and the test still passes.
        - changes_in_review_behavior: upload_as_draft
        - verbose_log: true

  test_apk_deploy_custom_track:
    summary: Tests deploying an APK to a user-defined track
    envs:

    - TEST_APP_URL: https://github.com/bitrise-io/sample-apps-android-sdk22.git
    - BRANCH: master

    - BITRISEIO_ANDROID_KEYSTORE_URL: $SIMPLESAMPLE_ANDROID_KEYSTORE_URL
    - BITRISEIO_ANDROID_KEYSTORE_PASSWORD: $SIMPLESAMPLE_ANDROID_KEYSTORE_PASSWORD
    - BITRISEIO_ANDROID_KEYSTORE_ALIAS: $SIMPLESAMPLE_ANDROID_KEY_ALIAS
    - BITRISEIO_ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: $SIMPLESAMPLE_ANDROID_KEY_PASSWORD

    - PACKAGE_NAME: com.bitrise_io.sample_apps_android_simple_google_play_deploy
    - SERVICE_ACCOUNT_KEY_URL: $GOOGLE_PLAY_SERVICE_ACCOUNT_KEY_URL
    - TRACK: apk-testing
    before_run:
    - _setup
    steps:
    - set-java-version:
        inputs:
        - set_java_version: "17"
    - change-android-versioncode-and-versionname:
        inputs:
        - build_gradle_path: ./app/build.gradle
        - new_version_code: $BITRISE_BUILD_NUMBER
        - new_version_name: 0.2.4
    - gradle-runner:
        inputs:
        - gradle_task: assembleRelease
        - gradlew_path: ./gradlew
    - sign-apk:
        inputs:
        - android_app: $BITRISE_APK_PATH_LIST
        - use_apk_signer: true
    - path::./:
        title: Execute step
        # Limit running this test to only one stack to avoid parallel testing issues
        # Running E2E tests on all stacks in parallel would cause conflicting deployments in Google Play to the same app
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
        inputs:
        - service_account_json_key_path: $SERVICE_ACCOUNT_KEY_URL
        - package_name: $PACKAGE_NAME
        - app_path: $BITRISE_SIGNED_APK_PATH
        - track: $TRACK
        - mapping_file: ""
        - user_fraction: ""
        - retry_without_sending_to_review: true
        - changes_in_review_behavior: upload_as_draft
        - verbose_log: true
  test_dry_run:
    envs:
    - TEST_APP_URL: https://github.com/bitrise-io/sample-apps-android-sdk22.git
    - BRANCH: master

    - BITRISEIO_ANDROID_KEYSTORE_URL: $SIMPLESAMPLE_ANDROID_KEYSTORE_URL
    - BITRISEIO_ANDROID_KEYSTORE_PASSWORD: $SIMPLESAMPLE_ANDROID_KEYSTORE_PASSWORD
    - BITRISEIO_ANDROID_KEYSTORE_ALIAS: $SIMPLESAMPLE_ANDROID_KEY_ALIAS
    - BITRISEIO_ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: $SIMPLESAMPLE_ANDROID_KEY_PASSWORD

    - PACKAGE_NAME: com.bitrise_io.sample_apps_android_simple_google_play_deploy
    - SERVICE_ACCOUNT_KEY_URL: $GOOGLE_PLAY_SERVICE_ACCOUNT_KEY_URL
    - TRACK: internal
    before_run:
    - _setup
    steps:
    - set-java-version:
        inputs:
        - set_java_version: "17"
    - script:
        title: Set $VERSION_CODE higher than previously submitted
        inputs:
        - content: |-
            set -ex

            envman add --key VERSION_CODE --value $(( $BITRISE_BUILD_NUMBER + 1 ))
    - change-android-versioncode-and-versionname:
        inputs:
        - build_gradle_path: ./app/build.gradle
        - new_version_code: $VERSION_CODE
        - new_version_name: 0.2.5-dryrun
    - gradle-runner:
        inputs:
        - gradle_task: assembleRelease
        - gradlew_path: ./gradlew
    - sign-apk:
        inputs:
        - android_app: $BITRISE_APK_PATH_LIST
        - use_apk_signer: true
    - path::./:
        title: Execute step
        # Limit running this test to only one stack to avoid parallel testing issues
        # Running E2E tests on all stacks in parallel would cause conflicting deployments in Google Play to the same app
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
        inputs:
        - service_account_json_key_path: $SERVICE_ACCOUNT_KEY_URL
        - package_name: $PACKAGE_NAME
        - app_path: $BITRISE_SIGNED_APK_PATH
        - dry_run: true
        - track: $TRACK
        - mapping_file: ""
        - user_fraction: ""
        - retry_without_sending_to_review: true
        - verbose_log: true

  test_no_track:
    summary: Tests an experimental trackless upload (no track assigned)
    envs:
    - TEST_APP_URL: https://github.com/bitrise-io/sample-apps-android-sdk22.git
    - BRANCH: master

    - BITRISEIO_ANDROID_KEYSTORE_URL: $SIMPLESAMPLE_ANDROID_KEYSTORE_URL
    - BITRISEIO_ANDROID_KEYSTORE_PASSWORD: $SIMPLESAMPLE_ANDROID_KEYSTORE_PASSWORD
    - BITRISEIO_ANDROID_KEYSTORE_ALIAS: $SIMPLESAMPLE_ANDROID_KEY_ALIAS
    - BITRISEIO_ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: $SIMPLESAMPLE_ANDROID_KEY_PASSWORD

    - PACKAGE_NAME: com.bitrise_io.sample_apps_android_simple_google_play_deploy
    - SERVICE_ACCOUNT_KEY_URL: $GOOGLE_PLAY_SERVICE_ACCOUNT_KEY_URL
    before_run:
    - _setup
    steps:
    - set-java-version:
        inputs:
        - set_java_version: "17"
    - script:
        title: Set $VERSION_CODE higher than previously submitted
        inputs:
        - content: |-
            set -ex

            envman add --key VERSION_CODE --value $(( $BITRISE_BUILD_NUMBER + 1 ))
    - change-android-versioncode-and-versionname:
        inputs:
        - build_gradle_path: ./app/build.gradle
        - new_version_code: $VERSION_CODE
        - new_version_name: 0.2.5-notrack
    - gradle-runner:
        inputs:
        - gradle_task: assembleRelease
        - gradlew_path: ./gradlew
    - sign-apk:
        inputs:
        - android_app: $BITRISE_APK_PATH_LIST
        - use_apk_signer: true
    - path::./:
        title: Execute step
        # Limit running this test to only one stack to avoid parallel testing issues
        # Running E2E tests on all stacks in parallel would cause conflicting deployments in Google Play to the same app
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
        inputs:
        - service_account_json_key_path: $SERVICE_ACCOUNT_KEY_URL
        - package_name: $PACKAGE_NAME
        - app_path: $BITRISE_SIGNED_APK_PATH
        - track: ""
        - mapping_file: ""
        - user_fraction: ""
        - retry_without_sending_to_review: true
        - verbose_log: true

  test_git_reference_upload_as_draft:
    summary: |-
      Runs the Step from its git URL at this branch, the way a customer tries an unreleased branch, instead of
      path::./. This proves the Bitrise CLI's Go toolkit can build the go 1.26 module on the stack, and deploys an
      APK to the apk-testing track with changes_in_review_behavior: upload_as_draft. Point the reference at master
      once the branch is merged.
    envs:
    - TEST_APP_URL: https://github.com/bitrise-io/sample-apps-android-sdk22.git
    - BRANCH: master

    - BITRISEIO_ANDROID_KEYSTORE_URL: $SIMPLESAMPLE_ANDROID_KEYSTORE_URL
    - BITRISEIO_ANDROID_KEYSTORE_PASSWORD: $SIMPLESAMPLE_ANDROID_KEYSTORE_PASSWORD
    - BITRISEIO_ANDROID_KEYSTORE_ALIAS: $SIMPLESAMPLE_ANDROID_KEY_ALIAS
    - BITRISEIO_ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: $SIMPLESAMPLE_ANDROID_KEY_PASSWORD

    - PACKAGE_NAME: com.bitrise_io.sample_apps_android_simple_google_play_deploy
    - SERVICE_ACCOUNT_KEY_URL: $GOOGLE_PLAY_SERVICE_ACCOUNT_KEY_URL
    - TRACK: apk-testing
    before_run:
    - _setup
    steps:
    - set-java-version:
        inputs:
        - set_java_version: "17"
    - script:
        title: Set $VERSION_CODE
        inputs:
        - content: |-
            set -ex

            # The tests on this stack take BITRISE_BUILD_NUMBER + 0..8 on the same app; this one takes + 2.
            envman add --key VERSION_CODE --value $(( $BITRISE_BUILD_NUMBER + 2 ))
    - change-android-versioncode-and-versionname:
        inputs:
        - build_gradle_path: ./app/build.gradle
        - new_version_code: $VERSION_CODE
        - new_version_name: 0.2.7-git
    - gradle-runner:
        inputs:
        - gradle_task: assembleRelease
        - gradlew_path: ./gradlew
    - sign-apk:
        inputs:
        - android_app: $BITRISE_APK_PATH_LIST
        - use_apk_signer: true
    - script:
        title: Go on this stack
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
        inputs:
        - content: |-
            # The Bitrise CLI builds Go Steps with the system Go when it is at least 1.22.12; a go 1.26 module then
            # needs Go's toolchain download (GOTOOLCHAIN=auto, the default) unless the system Go is 1.26 or newer.
            go version || echo "no go on PATH"
            echo "GOTOOLCHAIN=${GOTOOLCHAIN:-<unset>}"
    - git::https://github.com/bitrise-steplib/steps-google-play-deploy.git@SSW-3223-upload-as-draft:
        title: Execute step from its git URL
        # The Linux stack's system Go is older than the module's, so this also covers Go's toolchain download.
        # (Building on macOS with a newer system Go was verified by hand; every Step run stays on one stack because
        # Google Play keeps one open edit per service account.)
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
        inputs:
        - service_account_json_key_path: $SERVICE_ACCOUNT_KEY_URL
        - package_name: $PACKAGE_NAME
        - app_path: $BITRISE_SIGNED_APK_PATH
        - track: $TRACK
        - mapping_file: ""
        - user_fraction: ""
        - changes_in_review_behavior: upload_as_draft
        - verbose_log: true

  test_exp_e3_trackless_commit_during_review:
    summary: |-
      Experiment E3 (SSW-3223): what Google Play does with commits while a review is in progress. All APKs are built
      first, then five deploys run back to back so every probe lands inside the review window run X opens.
      Run X deploys an APK to apk-testing with Google Play's defaults, which keeps the app's changes in review for a
      few minutes. Run Y uploads another APK with no track and changes_in_review_behavior=fail: refused means an
      artifact-only commit is a submission and the default behavior would cancel the review; committed means trackless
      uploads leave a review alone. Run T is the same trackless upload with upload_as_draft, which has no track to
      save a draft on. Run D deploys with status=draft from the start and upload_as_draft. Run Z is the control, a
      normal track deploy with fail, which must be refused to prove the window was still open.
      Runs Y, T, D and Z are skippable so the build stays green; the result is in their logs.
    envs:
    - TEST_APP_URL: https://github.com/bitrise-io/sample-apps-android-sdk22.git
    - BRANCH: master

    - BITRISEIO_ANDROID_KEYSTORE_URL: $SIMPLESAMPLE_ANDROID_KEYSTORE_URL
    - BITRISEIO_ANDROID_KEYSTORE_PASSWORD: $SIMPLESAMPLE_ANDROID_KEYSTORE_PASSWORD
    - BITRISEIO_ANDROID_KEYSTORE_ALIAS: $SIMPLESAMPLE_ANDROID_KEY_ALIAS
    - BITRISEIO_ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: $SIMPLESAMPLE_ANDROID_KEY_PASSWORD

    - PACKAGE_NAME: com.bitrise_io.sample_apps_android_simple_google_play_deploy
    - SERVICE_ACCOUNT_KEY_URL: $GOOGLE_PLAY_SERVICE_ACCOUNT_KEY_URL
    - TRACK: apk-testing
    before_run:
    - _setup
    steps:
    - set-java-version:
        inputs:
        - set_java_version: "17"
    - script:
        title: Set the version codes of runs X, Y, T, D and Z
        inputs:
        - content: |-
            set -ex

            # The other tests on this stack use BITRISE_BUILD_NUMBER + 0..3 on the same app.
            envman add --key VERSION_CODE_X --value $(( $BITRISE_BUILD_NUMBER + 4 ))
            envman add --key VERSION_CODE_Y --value $(( $BITRISE_BUILD_NUMBER + 5 ))
            envman add --key VERSION_CODE_T --value $(( $BITRISE_BUILD_NUMBER + 6 ))
            envman add --key VERSION_CODE_D --value $(( $BITRISE_BUILD_NUMBER + 7 ))
            envman add --key VERSION_CODE_Z --value $(( $BITRISE_BUILD_NUMBER + 8 ))
    - change-android-versioncode-and-versionname:
        inputs:
        - build_gradle_path: ./app/build.gradle
        - new_version_code: $VERSION_CODE_X
        - new_version_name: 0.2.8-e3x
    - gradle-runner:
        inputs:
        - gradle_task: assembleRelease
        - gradlew_path: ./gradlew
    - sign-apk:
        inputs:
        - android_app: $BITRISE_APK_PATH_LIST
        - use_apk_signer: true
    - script:
        title: Keep the signed APK path of run X
        inputs:
        - content: envman add --key APK_X --value "$BITRISE_SIGNED_APK_PATH"
    - change-android-versioncode-and-versionname:
        inputs:
        - build_gradle_path: ./app/build.gradle
        - new_version_code: $VERSION_CODE_Y
        - new_version_name: 0.2.8-e3y
    - gradle-runner:
        inputs:
        - gradle_task: assembleRelease
        - gradlew_path: ./gradlew
    - sign-apk:
        inputs:
        - android_app: $BITRISE_APK_PATH_LIST
        - use_apk_signer: true
    - script:
        title: Keep the signed APK path of run Y
        inputs:
        - content: envman add --key APK_Y --value "$BITRISE_SIGNED_APK_PATH"
    - change-android-versioncode-and-versionname:
        inputs:
        - build_gradle_path: ./app/build.gradle
        - new_version_code: $VERSION_CODE_T
        - new_version_name: 0.2.8-e3t
    - gradle-runner:
        inputs:
        - gradle_task: assembleRelease
        - gradlew_path: ./gradlew
    - sign-apk:
        inputs:
        - android_app: $BITRISE_APK_PATH_LIST
        - use_apk_signer: true
    - script:
        title: Keep the signed APK path of run T
        inputs:
        - content: envman add --key APK_T --value "$BITRISE_SIGNED_APK_PATH"
    - change-android-versioncode-and-versionname:
        inputs:
        - build_gradle_path: ./app/build.gradle
        - new_version_code: $VERSION_CODE_D
        - new_version_name: 0.2.8-e3d
    - gradle-runner:
        inputs:
        - gradle_task: assembleRelease
        - gradlew_path: ./gradlew
    - sign-apk:
        inputs:
        - android_app: $BITRISE_APK_PATH_LIST
        - use_apk_signer: true
    - script:
        title: Keep the signed APK path of run D
        inputs:
        - content: envman add --key APK_D --value "$BITRISE_SIGNED_APK_PATH"
    - change-android-versioncode-and-versionname:
        inputs:
        - build_gradle_path: ./app/build.gradle
        - new_version_code: $VERSION_CODE_Z
        - new_version_name: 0.2.8-e3z
    - gradle-runner:
        inputs:
        - gradle_task: assembleRelease
        - gradlew_path: ./gradlew
    - sign-apk:
        inputs:
        - android_app: $BITRISE_APK_PATH_LIST
        - use_apk_signer: true
    - script:
        title: Keep the signed APK path of run Z
        inputs:
        - content: envman add --key APK_Z --value "$BITRISE_SIGNED_APK_PATH"
    - path::./:
        title: "Run X: default commit to apk-testing, opens the review window"
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
        inputs:
        - service_account_json_key_path: $SERVICE_ACCOUNT_KEY_URL
        - package_name: $PACKAGE_NAME
        - app_path: $APK_X
        - track: $TRACK
        - mapping_file: ""
        - user_fraction: ""
        - changes_in_review_behavior: cancel_and_resubmit
        - verbose_log: true
    - path::./:
        title: "Run Y: trackless commit with fail, the probe"
        is_skippable: true
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
        inputs:
        - service_account_json_key_path: $SERVICE_ACCOUNT_KEY_URL
        - package_name: $PACKAGE_NAME
        - app_path: $APK_Y
        - track: ""
        - mapping_file: ""
        - user_fraction: ""
        - changes_in_review_behavior: fail
        - verbose_log: true
    - path::./:
        title: "Run T: trackless commit with upload_as_draft"
        is_skippable: true
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
        inputs:
        - service_account_json_key_path: $SERVICE_ACCOUNT_KEY_URL
        - package_name: $PACKAGE_NAME
        - app_path: $APK_T
        - track: ""
        - mapping_file: ""
        - user_fraction: ""
        - changes_in_review_behavior: upload_as_draft
        - verbose_log: true
    - path::./:
        title: "Run D: draft from the start with upload_as_draft"
        is_skippable: true
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
        inputs:
        - service_account_json_key_path: $SERVICE_ACCOUNT_KEY_URL
        - package_name: $PACKAGE_NAME
        - app_path: $APK_D
        - track: $TRACK
        - mapping_file: ""
        - user_fraction: ""
        - status: draft
        - changes_in_review_behavior: upload_as_draft
        - verbose_log: true
    - path::./:
        title: "Run Z: track commit with fail, the control, expected to be refused"
        is_skippable: true
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
        inputs:
        - service_account_json_key_path: $SERVICE_ACCOUNT_KEY_URL
        - package_name: $PACKAGE_NAME
        - app_path: $APK_Z
        - track: $TRACK
        - mapping_file: ""
        - user_fraction: ""
        - changes_in_review_behavior: fail
        - verbose_log: true

  _setup:
    steps:
    - script:
        title: Delete _tmp dir
        inputs:
        - content: rm -rf _tmp
    - change-workdir:
        title: Switch working dir to _tmp
        run_if: "true"
        inputs:
        - path: ./_tmp
        - is_create_path: true
    - git::https://github.com/bitrise-steplib/bitrise-step-simple-git-clone.git:
        inputs:
        - repository_url: $TEST_APP_URL
        - clone_into_dir: .
        - branch: $BRANCH
